<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宏國地政 | 易丞地政 - AI 萬能提問系統 (v5.0)</title>
    <style>
        :root {
            --primary-color: #0f4c81; 
            --accent-color: #c5a065;
            --bg-color: #f0f2f5;
            --text-color: #333;
            --card-bg: #ffffff;
            --highlight-bg: #eeffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .brand-header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        .brand-subtitle {
            font-size: 0.9rem;
            color: #e0e0e0;
            margin-top: 5px;
        }

        .container {
            max-width: 850px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .main-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-top: 5px solid var(--accent-color);
        }

        .intro-text {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .form-section {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .form-section:hover {
            border-color: #cbd5e0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .form-section.model-section {
            background-color: var(--highlight-bg);
            border-color: #b2ebf2;
            border-left: 4px solid #00bcd4;
        }

        .form-section.constraint-section {
            background-color: #fff5f5;
            border-color: #fed7d7;
            border-left: 4px solid #e53e3e;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .highlight-label {
            background-color: #ffeb3b;
            padding: 2px 6px;
            border-radius: 4px;
            color: #333;
        }

        .helper-text {
            font-size: 0.85em;
            color: #6c757d;
            margin-bottom: 10px;
            display: block;
            line-height: 1.4;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fff;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.1);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        /* --- 快捷標籤區域與分類 --- */
        .tag-group {
            margin-bottom: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        
        .tag-category {
            font-size: 0.8rem;
            font-weight: bold;
            color: #718096;
            margin-right: 5px;
            min-width: 75px;
        }

        .tag-btn {
            background-color: #edf2f7;
            color: #4a5568;
            border: 1px solid #e2e8f0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        /* 工作類標籤 Hover */
        .tag-btn.work:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        /* 生活類標籤 Hover */
        .tag-btn.life:hover {
            background-color: #ed8936;
            color: white;
            border-color: #ed8936;
        }
        
        .tag-btn:active {
            transform: scale(0.95);
        }

        #customFormatInput {
            display: none;
            margin-top: 10px;
            border-color: var(--accent-color);
            background-color: #fffbf0;
        }

        .flex-row {
            display: flex;
            gap: 15px;
        }

        .flex-row > div {
            flex: 1;
        }

        button.generate-btn {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
            margin-top: 10px;
        }

        button.generate-btn:active {
            transform: scale(0.98);
        }

        .result-area {
            margin-top: 30px;
            padding: 20px;
            background-color: #ecfdf5;
            border: 1px solid #10b981;
            border-radius: 8px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #finalPrompt {
            width: 100%;
            height: 350px;
            background: #1e1e1e;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 6px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            color: #d4d4d4;
            white-space: pre-wrap;
            overflow-y: auto;
            margin-bottom: 15px;
            user-select: text; 
            -webkit-user-select: text;
        }

        .copy-btn {
            width: 100%;
            padding: 12px;
            background-color: #059669;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #888;
            font-size: 0.8rem;
            border-top: 1px solid #eee;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .flex-row { flex-direction: column; gap: 0; }
            .tag-category { width: 100%; margin-bottom: 5px; }
            .brand-header h1 { font-size: 1.2rem; }
            .container { padding: 0 10px; margin-top: 10px; }
            .main-card { padding: 20px 15px; }
            button.generate-btn { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header class="brand-header">
        <h1>宏國地政 | 易丞地政</h1>
        <div class="brand-subtitle">AI 萬能提問系統 v5.0 (工作/生活雙效版)</div>
    </header>

    <div class="container">
        <div class="main-card">
            <p class="intro-text">
                無論是專業工作還是日常所需，點擊下方<b>「快捷按鈕」</b>，<br>
                系統將自動為您組合最完美的 AI 咒語！
            </p>

            <div class="flex-row">
                <div class="form-section">
                    <label>👤 <span class="highlight-label">1. AI 扮演角色 (Role)</span></label>
                    <input type="text" id="role" placeholder="請輸入角色..." value="資深地政士與專業顧問">
                    
                    <div class="tag-group" style="margin-top: 10px;">
                        <div class="tag-category">👔 專業工作</div>
                        <button type="button" class="tag-btn work" onclick="setInputValue('role', '資深地政士與專業不動產顧問')">👨‍⚖️ 地政顧問</button>
                        <button type="button" class="tag-btn work" onclick="setInputValue('role', '熟悉房地產稅務的專業會計師')">💰 稅務專家</button>
                        <button type="button" class="tag-btn work" onclick="setInputValue('role', '懂爆款文案與社群演算法的行銷企劃')">📱 行銷大師</button>
                    </div>
                    <div class="tag-group">
                        <div class="tag-category">🌟 日常生活</div>
                        <button type="button" class="tag-btn life" onclick="setInputValue('role', '溫暖且具備專業知識的心理諮商師')">🛋️ 心理諮商師</button>
                        <button type="button" class="tag-btn life" onclick="setInputValue('role', '熟悉全球機票與隱藏景點的旅遊達人')">✈️ 旅遊達人</button>
                        <button type="button" class="tag-btn life" onclick="setInputValue('role', '精通各國料理的米其林三星主廚')">🍳 頂級主廚</button>
                        <button type="button" class="tag-btn life" onclick="setInputValue('role', '嚴格但能給予科學訓練建議的健身教練')">💪 健身教練</button>
                    </div>
                </div>

                <div class="form-section">
                    <label>🎭 2. 語氣與風格 (Tone)</label>
                    <select id="tone">
                        <option value="專業、嚴謹、邏輯清晰且具備權威感">專業嚴謹 (適合正式文件)</option>
                        <option value="溫和、同理、耐心且具備親和力">溫和同理 (適合安撫/諮商)</option>
                        <option value="白話、幽默、擅長用生活化比喻">白話幽默 (適合社群貼文/初學者)</option>
                        <option value="熱情、充滿活力且激勵人心">熱情激勵 (適合教練/創意企劃)</option>
                        <option value="客觀、堅定、直指核心且不卑不亢">堅定談判 (適合處理糾紛/強硬表態)</option>
                    </select>
                </div>
            </div>

            <div class="form-section">
                <label>🎯 <span class="highlight-label">3. 核心任務 / 想解決的問題 (Task)</span></label>
                
                <div class="tag-group">
                    <div class="tag-category">👔 專業工作</div>
                    <button type="button" class="tag-btn work" onclick="appendValue('task', '請幫我擬定一份給客戶的「存證信函」，重點包含：\n1. \n2. ')">📝 寫存證信函</button>
                    <button type="button" class="tag-btn work" onclick="appendValue('task', '請幫我列出辦理「共有物分割」的完整 SOP 流程，以及需注意的盲點。')">📋 共有物分割</button>
                    <button type="button" class="tag-btn work" onclick="appendValue('task', '客戶想了解目前「房地合一稅」規定，請幫我試算並解釋如何節稅。')">🧮 稅務解釋</button>
                    <button type="button" class="tag-btn work" onclick="appendValue('task', '我需要寫一篇關於 [請填寫主題] 的 Facebook 貼文，吸引潛在客戶。')">✍️ 寫社群文案</button>
                </div>
                <div class="tag-group" style="margin-bottom: 8px;">
                    <div class="tag-category">🌟 日常生活</div>
                    <button type="button" class="tag-btn life" onclick="appendValue('task', '請幫我規劃一份五天四夜的 [請填寫國家] 自由行，包含交通與必吃美食。')">🗺️ 旅遊規劃</button>
                    <button type="button" class="tag-btn life" onclick="appendValue('task', '請幫我設計一週的健康減脂菜單，需考慮上班族備餐的方便性。')">🥗 減脂菜單</button>
                    <button type="button" class="tag-btn life" onclick="appendValue('task', '我今天要參加一場面試，請扮演面試官，跟我進行模擬面試與指導。')">🗣️ 模擬面試</button>
                    <button type="button" class="tag-btn life" onclick="appendValue('task', '我的電腦/手機出現了這個問題：[請填寫]，請教我怎麼排除故障。')">💻 科技除錯</button>
                    <button type="button" class="tag-btn life" onclick="appendValue('task', '請幫我把這篇長篇大論的文章，總結成 3 個核心重點。')">✂️ 重點總結</button>
                </div>

                <textarea id="task" placeholder="請描述您想請 AI 幫忙做什麼事..."></textarea>
            </div>

            <div class="form-section">
                <label>📌 <span class="highlight-label">4. 背景資訊或特殊情況 (Context)</span></label>
                
                <div class="tag-group">
                    <div class="tag-category">👔 專業工作</div>
                    <button type="button" class="tag-btn work" onclick="appendValue('context', '【受眾對象】客戶是高齡長輩，完全聽不懂艱澀的法律條文。')">👴 長輩客戶</button>
                    <button type="button" class="tag-btn work" onclick="appendValue('context', '【特殊狀況】目前共有人之間有嚴重的意見分歧甚至糾紛。')">⚔️ 內部糾紛</button>
                    <button type="button" class="tag-btn work" onclick="appendValue('context', '【急迫性】這是一件急件，有強烈的時間壓力。')">⏱️ 急件處理</button>
                </div>
                <div class="tag-group" style="margin-bottom: 8px;">
                    <div class="tag-category">🌟 日常生活</div>
                    <button type="button" class="tag-btn life" onclick="appendValue('context', '【完全新手】我對這個領域完全零基礎，請把我當成 10 歲小孩來教。')">👶 零基礎新手</button>
                    <button type="button" class="tag-btn life" onclick="appendValue('context', '【預算有限】我目前的預算非常吃緊，請推薦最高 CP 值的方案。')">💸 預算有限</button>
                    <button type="button" class="tag-btn life" onclick="appendValue('context', '【時間緊迫】我只有不到 3 分鐘可以看，請直接給我條列式的重點懶人包。')">⏳ 只要懶人包</button>
                    <button type="button" class="tag-btn life" onclick="appendValue('context', '【選擇困難】我目前陷入選擇障礙，請直接幫我選一個最好的並說服我。')">⚖️ 選擇困難</button>
                    <button type="button" class="tag-btn life" onclick="appendValue('context', '【情緒狀態】我現在覺得非常焦慮與挫折，請先給我一些溫暖的鼓勵。')">🌧️ 需要安慰</button>
                </div>

                <textarea id="context" placeholder="補充細節：您的程度？時間預算限制？受眾是誰？..."></textarea>
            </div>

            <div class="form-section constraint-section">
                <label>🛡️ 5. 限制條件與防雷 (Constraints)</label>
                
                <div class="tag-group" style="margin-bottom: 8px;">
                    <button type="button" class="tag-btn work" onclick="appendValue('constraints', '1. 務必以「台灣現行最新法規」為準。\n2. 嚴禁使用中國大陸法律術語（如：小區、物業，請改用社區、管委會）。')">🏛️ 台灣地政法規防雷</button>
                    <button type="button" class="tag-btn life" onclick="appendValue('constraints', '1. 請用繁體中文回答。\n2. 語氣請保持自然，不要像機器人，也不要使用過多的表情符號。')">🇹🇼 基本繁中限制</button>
                    <button type="button" class="tag-btn life" onclick="appendValue('constraints', '回答字數請嚴格限制在 300 字以內。')">📏 字數限制</button>
                </div>

                <textarea id="constraints" placeholder="例如：請務必以「台灣最新現行法規」為準，或者：字數不得超過 500 字..."></textarea>
            </div>

            <div class="form-section model-section">
                <label>🧠 6. 啟動思維引擎 (Mental Model)</label>
                <select id="mentalModel" onchange="updateModelHint()">
                    <option value="none">✨ 專家直覺模式 (直接給予最佳解答)</option>
                    <option value="mece">🧩 MECE 麥肯錫分析 (不重不漏/全面盤點)</option>
                    <option value="first_principle">🔍 第一性原理 (打破盲點/回歸事物本質)</option>
                    <option value="satir">❄️ 薩提爾冰山模型 (處理人際情緒/溝通衝突)</option>
                    <option value="feynman">📖 費曼學習法 (把複雜概念變白話文教學)</option>
                    <option value="swot">📊 SWOT 分析 (案件評估/人生抉擇分析)</option>
                    <option value="six_hats">🎩 六頂思考帽 (多角度腦力激盪/企劃發想)</option>
                </select>
                <div id="modelHint" style="margin-top:10px; font-size: 0.85rem; color: #00838f; background: rgba(255,255,255,0.6); padding: 8px; border-radius: 4px; display:none;"></div>
            </div>

            <div class="form-section">
                <label>📝 7. 希望的回答格式 (Format)</label>
                <select id="format" onchange="toggleCustomFormat()">
                    <option value="條列式重點解析（包含：核心結論、依據、實務建議）">條列式重點解析 (適合快速閱讀)</option>
                    <option value="詳細的操作步驟 SOP（請依照第一步、第二步...列出）">詳細的操作步驟教學 (SOP)</option>
                    <option value="一封正式且得體的 Email 信件">正式的 Email / 回函信件</option>
                    <option value="情境模擬對話稿（包含雙方對白，並標註情緒提示）">情境模擬對話稿 (Roleplay)</option>
                    <option value="Markdown 結構化表格（比較優缺點差異）">比較表格 (優缺點/差異對照)</option>
                    <option value="custom">✏️ 自訂格式 (手動輸入...)</option>
                </select>
                <input type="text" id="customFormatInput" placeholder="請輸入您想要的格式（例如：心智圖文字稿、簡報大綱...）">
            </div>

            <button class="generate-btn" onclick="generatePrompt()">⚡ 立即產生 Pro 級指令</button>

            <div class="result-area" id="resultArea">
                <h3 style="margin-top:0; color: #047857;">✅ 萬能咒語已生成 (Ready to Copy)：</h3>
                <div id="finalPrompt"></div>
                <button class="copy-btn" onclick="copyToClipboard()">📋 點此複製，貼給 AI (ChatGPT/Claude/Gemini)</button>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 宏國地政 | 易丞地政. All Rights Reserved.</p>
        <p>AI Prompt Generator for Work, Life, and Creative Problem Solving.</p>
    </footer>

    <script>
        // --- 快捷按鈕功能 ---
        function setInputValue(elementId, value) {
            document.getElementById(elementId).value = value;
        }

        function appendValue(elementId, value) {
            const el = document.getElementById(elementId);
            if (el.value.trim() !== '') {
                el.value += '\n' + value;
            } else {
                el.value = value;
            }
            el.focus();
        }

        // --- 模型提示說明資料庫 ---
        const modelHints = {
            'mece': '💡 <b>適合：</b>盤點風險、全面性分析。<br>AI 將確保分析「相互獨立，完全窮盡」，不漏掉任何一個可能引爆的雷點。',
            'feynman': '💡 <b>適合：</b>學習新知、將複雜事情解釋給外行人聽。<br>AI 將會用生活化的比喻來重新闡述，確保 10 歲小孩都能聽懂。',
            'first_principle': '💡 <b>適合：</b>遇到前所未見的難題、創新解法。<br>AI 將打破慣例，回歸事物的最基本事實重新推導解決方案。',
            'satir': '💡 <b>適合：</b>面對憤怒客戶、情侶吵架、溝通衝突。<br>AI 將分析對方的「渴望與感受」，並提供冰山下的對話與安撫策略。',
            'swot': '💡 <b>適合：</b>評估案件是否接手、職涯規劃、人生選擇。<br>AI 將結構化分析優勢、劣勢、機會與威脅。',
            'six_hats': '💡 <b>適合：</b>團隊腦力激盪、企劃發想、跳脫主觀框架。<br>AI 會分別用客觀(白)、情感(紅)、悲觀(黑)、樂觀(黃)、創意(綠)的角度來審視這個問題。'
        };

        function updateModelHint() {
            const select = document.getElementById('mentalModel');
            const hintDiv = document.getElementById('modelHint');
            const val = select.value;

            if (modelHints[val]) {
                hintDiv.innerHTML = modelHints[val];
                hintDiv.style.display = 'block';
            } else {
                hintDiv.style.display = 'none';
            }
        }

        function toggleCustomFormat() {
            const selectBox = document.getElementById('format');
            const customInput = document.getElementById('customFormatInput');
            
            if (selectBox.value === 'custom') {
                customInput.style.display = 'block';
                customInput.focus();
            } else {
                customInput.style.display = 'none';
            }
        }

        function generatePrompt() {
            const role = document.getElementById('role').value.trim() || "萬能 AI 助理";
            const tone = document.getElementById('tone').value;
            const task = document.getElementById('task').value.trim();
            const context = document.getElementById('context').value.trim() || "無特殊背景資訊。";
            const constraints = document.getElementById('constraints').value.trim() || "無特殊限制。";
            const model = document.getElementById('mentalModel').value;
            
            let formatSelect = document.getElementById('format').value;
            let finalFormat = formatSelect === 'custom' ? (document.getElementById('customFormatInput').value.trim() || "清楚的文字說明") : formatSelect;

            if (!task) {
                alert("⚠️ 執行失敗：請務必在第 3 點輸入「想解決的問題或任務」！");
                document.getElementById('task').focus();
                return;
            }

            let mentalModelInstruction = "";
            switch(model) {
                case 'mece':
                    mentalModelInstruction = `請運用【MECE 麥肯錫不重不漏原則】進行分析：\n將問題拆解成相互獨立（Mutually Exclusive）、完全窮盡（Collectively Exhaustive）的幾個面向。請確保涵蓋所有的風險與實務操作層面，不遺漏任何關鍵點。`;
                    break;
                case 'feynman':
                    mentalModelInstruction = `請運用【費曼學習法】進行解釋：\n1. 想像你正在教導一位完全沒有該領域背景的普通人或小孩。\n2. 嚴禁直接堆砌艱澀術語，若必須提到專有名詞，請務必用生活化的「譬喻」來解釋。\n3. 用最直白、簡單的邏輯重新闡述，確保聽者能秒懂。`;
                    break;
                case 'first_principle':
                    mentalModelInstruction = `請運用【第一性原理】進行拆解：\n1. Deconstruct：剝除所有表面的業界慣例與經驗法則，找出此問題最核心的物理限制或客觀事實。\n2. Reconstruct：從這些不可撼動的核心事實出發，一步步重新推導出最根本、最有效的解決方案。`;
                    break;
                case 'satir':
                    mentalModelInstruction = `請運用【薩提爾冰山模型】處理此情境：\n1. 分析對方的表面行為與言語。\n2. 深入挖掘冰山下隱藏的：感受（情緒）、觀點（認知偏差）、期待（對我們的要求）、渴望（被尊重/安全感/愛）。\n3. 提供一段「一致性溝通」的應對策略與話術範例。`;
                    break;
                case 'swot':
                    mentalModelInstruction = `請運用【SWOT 策略分析】進行全面評估：\n針對此情況，條列分析 S(內部優勢與籌碼)、W(內部劣勢與風險)、O(外部機會與轉機)、T(外部威脅與最壞狀況)，並給出最終的綜合決策建議。`;
                    break;
                case 'six_hats':
                    mentalModelInstruction = `請運用【六頂思考帽】進行多角度分析：\n分別戴上白帽(客觀事實)、紅帽(情感直覺)、黑帽(風險與悲觀預測)、黃帽(利益與樂觀預測)、綠帽(創意與替代方案) 來審視這個任務，最後戴上藍帽(統整)給出結論。`;
                    break;
                default:
                    mentalModelInstruction = "請運用你深厚的專業知識庫，進行全面且具深度的解析。";
            }

            const optimizedPrompt = `### Role (角色設定)
你現在是一位：${role}。
你的語氣與風格必須：${tone}。

### Task (核心任務)
我需要你幫我解決以下問題/任務：
${task}

### Context (背景資訊)
${context}

### Constraints (限制與規則)
${constraints}
- 在給出最終答案前，請先在腦海中進行 Step-by-Step 的邏輯推演。

### Thinking Framework (思考框架)
${mentalModelInstruction}

### Output Format (輸出格式)
請嚴格依照「${finalFormat}」的格式輸出你的回答。`.trim();

            document.getElementById('finalPrompt').innerText = optimizedPrompt;
            document.getElementById('resultArea').style.display = 'block';
            
            setTimeout(() => {
                document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        function copyToClipboard() {
            const text = document.getElementById('finalPrompt').innerText;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    alert("✅ 複製成功！\n請將這段指令貼給 ChatGPT、Claude 或 Gemini 即可！");
                }).catch(err => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                alert("✅ 複製成功！");
            } catch (err) {
                alert("❌ 複製失敗，請手動選取文字複製。");
            }
            document.body.removeChild(textArea);
        }
    </script>

</body>
